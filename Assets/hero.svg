<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
  <title id="t">Mohammad Raouf Abedini, AI security researcher</title>
  <desc id="d">A desktop window in the style of the raoufabedini.dev research OS. It introduces Raouf Abedini, who builds host-side controls for what AI agents are permitted to do and tests them against live models. An animation shows agent tool calls reaching a host authorization gate: permitted calls pass, restricted calls stop.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b4f9e"/>
      <stop offset="0.45" stop-color="#0a3877"/>
      <stop offset="1" stop-color="#041a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="-0.06" r="0.9">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#58b2f5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58b2f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0c4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fe0c4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cfeaff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#cfe6fa" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#bcdcf5" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#9cc8ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3f7fbd" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="close" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a79c"/>
      <stop offset="0.5" stop-color="#d1442f"/>
      <stop offset="1" stop-color="#b3261e"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b9d6ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4f9e"/>
      <stop offset="0.5" stop-color="#3c8fdc"/>
      <stop offset="1" stop-color="#0b4f9e"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d9f1ff"/>
      <stop offset="0.5" stop-color="#3c8fdc"/>
      <stop offset="1" stop-color="#0a3877"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00102b" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="500" rx="14"/></clipPath>
  </defs>
  <style>
    .ui { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
    .pass { animation: pass 9s linear infinite both; }
    .deny { animation: deny 9s linear infinite both; }
    .deny .shell { animation: flag 9s linear infinite both; }
    .deny .lbl { animation: flagtext 9s linear infinite both; }
    .d0 { animation-delay: 0s; } .d1 { animation-delay: 1.5s; } .d2 { animation-delay: 4.5s; } .d3 { animation-delay: 6s; }
    .deny.d1 .shell, .deny.d1 .lbl { animation-delay: 1.5s; }
    .deny.d2 .shell, .deny.d2 .lbl { animation-delay: 4.5s; }
    .drift { animation: drift 16s ease-in-out infinite alternate; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pass {
      0% { transform: translateX(0); opacity: 0; }
      5% { opacity: 1; }
      82% { opacity: 1; }
      90%, 100% { transform: translateX(830px); opacity: 0; }
    }
    @keyframes deny {
      0% { transform: translateX(0); opacity: 0; }
      5% { opacity: 1; }
      38% { transform: translateX(358px); opacity: 1; }
      41% { transform: translateX(350px); }
      44% { transform: translateX(358px); }
      56% { transform: translateX(358px); opacity: 1; }
      63%, 100% { transform: translateX(358px); opacity: 0; }
    }
    @keyframes flag {
      0%, 37% { fill: #e3f1fd; stroke: #3c7fb1; }
      40%, 100% { fill: #fde7e5; stroke: #d1442f; }
    }
    @keyframes flagtext {
      0%, 37% { fill: #0b3d7a; }
      40%, 100% { fill: #9c1f15; }
    }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pass, .deny, .deny .shell, .deny .lbl, .drift, .pulse { animation: none; }
      .pass { transform: translateX(700px); }
      .deny { transform: translateX(358px); }
      .deny .shell { fill: #fde7e5; stroke: #d1442f; }
      .deny .lbl { fill: #9c1f15; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- wallpaper -->
    <rect width="1200" height="500" fill="url(#sky)"/>
    <rect width="1200" height="500" fill="url(#glow)"/>
    <g class="drift">
      <path d="M-80 420 C 220 250, 520 470, 860 300 S 1240 180, 1320 240" fill="none" stroke="url(#ribbonA)" stroke-width="46" filter="url(#soft)"/>
      <path d="M-80 470 C 260 330, 560 500, 900 360 S 1240 260, 1320 300" fill="none" stroke="url(#ribbonB)" stroke-width="20" filter="url(#soft)"/>
      <path d="M-80 120 C 240 40, 520 160, 840 70 S 1220 20, 1320 60" fill="none" stroke="url(#ribbonB)" stroke-width="14" filter="url(#soft)"/>
    </g>

    <!-- window -->
    <g filter="url(#shadow)">
      <rect x="60" y="24" width="1080" height="406" rx="9" fill="url(#glass)" stroke="#10305c" stroke-opacity="0.8"/>
      <rect x="61" y="25" width="1078" height="404" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
    </g>
    <text x="82" y="47" class="ui" font-size="15" fill="#0b1f3a">Raouf Abedini · Research OS</text>
    <!-- caption buttons -->
    <g>
      <rect x="1018" y="25" width="30" height="20" fill="url(#btn)" stroke="#10305c" stroke-opacity="0.5"/>
      <rect x="1048" y="25" width="30" height="20" fill="url(#btn)" stroke="#10305c" stroke-opacity="0.5"/>
      <path d="M1078 25 h46 v14 a6 6 0 0 1 -6 6 h-40 z" fill="url(#close)" stroke="#5c120c" stroke-opacity="0.7"/>
      <rect x="1028" y="37" width="10" height="2.5" fill="#0b1f3a"/>
      <rect x="1058.500" y="30.500" width="9" height="8" fill="none" stroke="#0b1f3a" stroke-width="1.6"/>
      <path d="M1096 30 l10 10 M1106 30 l-10 10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- paper -->
    <rect x="68" y="56" width="1064" height="366" fill="#ffffff" stroke="#10305c" stroke-opacity="0.45"/>

    <text x="100" y="100" class="mono" font-size="13" letter-spacing="2.4" fill="#0066cc">AI SECURITY RESEARCH · SYDNEY</text>
    <text x="98" y="152" class="ui" font-size="46" font-weight="700" fill="#0b1f3a">Mohammad Raouf Abedini</text>
    <text x="100" y="186" class="ui" font-size="19" fill="#3d3d3d">Adversarial robustness &amp; AI control · empirical safety evaluation</text>
    <text x="100" y="234" class="ui" font-size="22" fill="#0b1f3a">I build host-side controls for what AI agents are</text>
    <text x="100" y="264" class="ui" font-size="22" fill="#0b1f3a">permitted to do, then test them against live models.</text>

    <!-- readout -->
    <g class="ui">
      <rect x="770" y="84" width="330" height="188" rx="4" fill="#f6fafd" stroke="#d5dfe5"/>
      <path d="M935 84 v188 M770 178 h330" stroke="#d5dfe5"/>
      <text x="790" y="128" font-size="34" font-weight="700" fill="#0b4f9e">5</text>
      <text x="790" y="151" font-size="13" fill="#3d3d3d">sole-author preprints</text>
      <text x="955" y="128" font-size="34" font-weight="700" fill="#0b4f9e">2</text>
      <text x="955" y="151" font-size="13" fill="#3d3d3d">vendor disclosures</text>
      <text x="955" y="167" font-size="12" fill="#6b7785">Microsoft · Apple</text>
      <text x="790" y="222" font-size="34" font-weight="700" fill="#0b4f9e">93</text>
      <text x="790" y="245" font-size="13" fill="#3d3d3d">Simurgh releases</text>
      <text x="955" y="222" font-size="34" font-weight="700" fill="#0b4f9e">39</text>
      <text x="955" y="245" font-size="13" fill="#3d3d3d">Lean 4 proofs,</text>
      <text x="955" y="261" font-size="12" fill="#6b7785">gated on “sorry”</text>
    </g>

    <!-- authorization lane -->
    <rect x="100" y="296" width="1000" height="104" rx="6" fill="#eaf6fd" stroke="#bee6fd"/>
    <text x="116" y="317" class="mono" font-size="11" letter-spacing="1.6" fill="#3c7fb1">AGENT PROPOSES</text>
    <text x="640" y="317" class="mono" font-size="11" letter-spacing="1.6" fill="#0b4f9e" text-anchor="middle">HOST AUTHORIZATION</text>
    <text x="1084" y="317" class="mono" font-size="11" letter-spacing="1.6" fill="#3c7fb1" text-anchor="end">EFFECT</text>
    <path d="M116 345 H1084 M116 375 H1084" stroke="#bee6fd" stroke-dasharray="2 6"/>

    <g class="pass d0"><rect x="116" y="334" width="150" height="22" rx="11" fill="#e3f1fd" stroke="#3c7fb1"/><text x="191" y="349.500" class="mono" font-size="13" text-anchor="middle" fill="#0b3d7a">read_file</text></g>
    <g class="deny d2"><rect class="shell" x="116" y="334" width="150" height="22" rx="11" fill="#e3f1fd" stroke="#3c7fb1"/><text class="lbl mono" x="191" y="349.500" font-size="13" text-anchor="middle" fill="#0b3d7a">send_email</text></g>
    <g class="deny d1"><rect class="shell" x="116" y="364" width="150" height="22" rx="11" fill="#e3f1fd" stroke="#3c7fb1"/><text class="lbl mono" x="191" y="379.500" font-size="13" text-anchor="middle" fill="#0b3d7a">transfer_funds</text></g>
    <g class="pass d3"><rect x="116" y="364" width="150" height="22" rx="11" fill="#e3f1fd" stroke="#3c7fb1"/><text x="191" y="379.500" class="mono" font-size="13" text-anchor="middle" fill="#0b3d7a">search_docs</text></g>

    <!-- gate -->
    <rect x="632" y="324" width="16" height="70" rx="3" fill="url(#gate)" stroke="#06305f"/>
    <rect x="636" y="328" width="3" height="62" rx="1.5" fill="#ffffff" fill-opacity="0.55" class="pulse"/>

    <!-- taskbar -->
    <rect x="0" y="452" width="1200" height="48" fill="url(#bar)"/>
    <path d="M0 452.500 H1200" stroke="#ffffff" stroke-opacity="0.65"/>
    <circle cx="36" cy="476" r="18" fill="url(#orb)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
    <text x="36" y="483" class="ui" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">R</text>
    <g class="ui" font-size="14" fill="#ffffff">
      <rect x="72" y="459" width="176" height="34" rx="4" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.6"/>
      <text x="160" y="481" text-anchor="middle">Project Simurgh</text>
      <rect x="256" y="459" width="130" height="34" rx="4" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="321" y="481" text-anchor="middle">Preprints</text>
      <rect x="394" y="459" width="130" height="34" rx="4" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="459" y="481" text-anchor="middle">Agent tools</text>
      <text x="1176" y="473" text-anchor="end" font-size="13">raoufabedini.dev</text>
      <text x="1176" y="490" text-anchor="end" font-size="12" fill-opacity="0.85">Available December 2026</text>
    </g>
  </g>
</svg>
