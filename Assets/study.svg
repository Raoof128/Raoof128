<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Project Simurgh transfer study, October 2026</title>
  <desc id="d">Restricted-state trials that produced new effects, out of 24 per arm. Meta Llama-3.2-3B: 17 of 24 at baseline, 0 of 24 with composed host controls, with 23 of 24 useful completions kept and no valid proposal blocked. OpenAI gpt-6-luna: 0 of 24 at baseline and 0 of 24 with composed host controls, so no incremental protection was observed there. Wilson 95 percent intervals computed per state across six states: 43.6 to 97.0 percent versus 0.0 to 39.0 percent.</desc>
